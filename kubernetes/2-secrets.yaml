apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: business-management
type: Opaque
stringData:
  # PostgreSQL Secrets
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "postgres_password_123"
  DATABASE_URL: "postgresql://postgres:postgres_password_123@postgres-service.business-management.svc.cluster.local:5432/business_db"
  
  # JWT Secret
  JWT_SECRET: "your-secret-key-change-in-production-12345678901234567890"
  JWT_ALGORITHM: "HS256"
  
  # Service to Service Authentication
  SERVICE_AUTH_TOKEN: "service-to-service-secret-key"
  
  # Email Configuration (for notifications)
  SMTP_SERVER: "smtp.gmail.com"
  SMTP_PORT: "587"
  SMTP_USER: "your-email@gmail.com"
  SMTP_PASSWORD: "your-app-password"
