apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-esign-worker
  namespace: business-management
  labels:
    app: payment-esign-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-esign-worker
  template:
    metadata:
      labels:
        app: payment-esign-worker
    spec:
      containers:
      - name: payment-esign-worker
        image: payment-service:latest
        imagePullPolicy: Never
        command: ["python", "esign_worker.py"]
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: DATABASE_URL
        - name: KAFKA_BOOTSTRAP_SERVERS
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: KAFKA_BOOTSTRAP_SERVERS
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 256Mi
