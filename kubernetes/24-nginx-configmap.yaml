apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: business-management
data:
  nginx.conf: |
    user nginx;
    worker_processes auto;
    error_log /var/log/nginx/error.log warn;
    pid /var/run/nginx.pid;

    events {
        worker_connections 1024;
    }

    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;

        log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for"';

        access_log /var/log/nginx/access.log main;

        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        keepalive_timeout 65;
        types_hash_max_size 2048;

        # Rate limiting
        limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

        upstream auth_service {
            server auth-service.business-management.svc.cluster.local:8001;
        }

        upstream contract_service {
            server contract-service.business-management.svc.cluster.local:8002;
        }

        upstream payment_service {
            server payment-service.business-management.svc.cluster.local:8003;
        }

        upstream notification_service {
            server notification-service.business-management.svc.cluster.local:8004;
        }

        upstream production_service {
            server production-service.business-management.svc.cluster.local:8005;
        }

        upstream pricing_service {
            server pricing-service.business-management.svc.cluster.local:8006;
        }

        server {
            listen 80 default_server;
            server_name _;

            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, Origin, X-Requested-With" always;
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Credentials;
            proxy_redirect http://localhost/ /;
            proxy_redirect http://localhost:80/ /;

            if ($request_method = OPTIONS) {
                return 204;
            }

            # Health check endpoint
            location /health {
                access_log off;
                return 200 "OK\n";
                add_header Content-Type text/plain;
            }

            # Auth Service
            location /api/v1/auth/ {
                limit_req zone=api_limit burst=20 nodelay;
                proxy_pass http://auth_service;
                proxy_set_header Host $http_host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            # Contract Service
            location /api/v1/contracts {
                limit_req zone=api_limit burst=20 nodelay;
                proxy_pass http://contract_service;
                proxy_set_header Host $http_host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            # Customer routes are served by Contract Service
            location /api/v1/customers {
                proxy_pass http://contract_service;
                proxy_set_header Host $http_host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            # Payment Service
            location /api/v1/payments/ {
                limit_req zone=api_limit burst=20 nodelay;
                proxy_pass http://payment_service;
                proxy_set_header Host $http_host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            # Notification Service
            location /api/v1/notifications/ {
                limit_req zone=api_limit burst=20 nodelay;
                proxy_pass http://notification_service;
                proxy_set_header Host $http_host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            # Production Service
            location /api/v1/production/ {
                limit_req zone=api_limit burst=20 nodelay;
                proxy_pass http://production_service;
                proxy_set_header Host $http_host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            # Pricing Service
            location /api/v1/pricing/ {
                limit_req zone=api_limit burst=20 nodelay;
                proxy_pass http://pricing_service;
                proxy_set_header Host $http_host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            # Pricing Service routes not covered by the legacy /pricing path
            location /api/v1/price-lists/ {
                proxy_pass http://pricing_service;
                proxy_set_header Host $http_host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            location /api/v1/approvals/ {
                proxy_pass http://pricing_service;
                proxy_set_header Host $http_host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            location /api/v1/price-history/ {
                proxy_pass http://pricing_service;
                proxy_set_header Host $http_host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            # Swagger/OpenAPI docs
            location /api/docs {
                proxy_pass http://auth_service/docs;
                proxy_set_header Host $http_host;
            }

            location /api/openapi.json {
                proxy_pass http://auth_service/openapi.json;
                proxy_set_header Host $http_host;
            }

            # 404 for unknown routes
            location / {
                return 404;
            }
        }
    }
