apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: business-management
data:
  # PostgreSQL Configuration
  POSTGRES_HOST: "postgres-service.business-management.svc.cluster.local"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "business_db"
  
  # Redis Configuration
  REDIS_HOST: "redis-service.business-management.svc.cluster.local"
  REDIS_PORT: "6379"
  
  # Kafka Configuration
  KAFKA_BOOTSTRAP_SERVERS: "kafka-service.business-management.svc.cluster.local:9092"
  KAFKA_BROKER: "kafka-service.business-management.svc.cluster.local:9092"
  
  # Service URLs
  AUTH_SERVICE_URL: "http://auth-service.business-management.svc.cluster.local:8001"
  CONTRACT_SERVICE_URL: "http://contract-service.business-management.svc.cluster.local:8002"
  PAYMENT_SERVICE_URL: "http://payment-service.business-management.svc.cluster.local:8003"
  NOTIFICATION_SERVICE_URL: "http://notification-service.business-management.svc.cluster.local:8004"
  PRODUCTION_SERVICE_URL: "http://production-service.business-management.svc.cluster.local:8005"
  PRICING_SERVICE_URL: "http://pricing-service.business-management.svc.cluster.local:8006"
  
  # Logging
  LOG_LEVEL: "INFO"
  
  # API Gateway
  GATEWAY_HOST: "0.0.0.0"
  GATEWAY_PORT: "80"
