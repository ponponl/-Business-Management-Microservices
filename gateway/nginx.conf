events {
    worker_connections 1024;
}

http {
    upstream auth_service { server auth-service:8000; }
    upstream pricing_service { server pricing-service:8000; }
    upstream contract_service { server contract-service:8000; }
    upstream production_service { server production-service:8000; }
    upstream payment_service { server payment-service:8000; }

    server {
        listen 80;

        # SV-01: Auth
        location /api/auth/ {
            proxy_pass http://auth_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # SV-02: Pricing
        location /api/pricing/ {
            proxy_pass http://pricing_service/api/pricing/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # SV-03: Contract
        location /api/contracts/ {
            proxy_pass http://contract_service/api/contracts/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # SV-04: Production
        location /api/production/ {
            proxy_pass http://production_service/api/production/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # SV-05: Payment
        location /api/payments/ {
            proxy_pass http://payment_service/api/payments/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}